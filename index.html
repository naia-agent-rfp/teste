<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Teste de Deploy — Em construção</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a; color: #f5f5f5; padding: 24px;
    }
    .card { max-width: 520px; text-align: center; }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: #8a8a8a; border: 1px solid #2a2a2a;
      border-radius: 999px; padding: 6px 14px; margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(28px, 6vw, 44px); font-weight: 600;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 16px;
    }
    p { font-size: 16px; line-height: 1.6; color: #a0a0a0; }
    .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; margin-right: 8px; vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    footer { margin-top: 40px; font-size: 12px; color: #4a4a4a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>Em construção</div>
    <h1>Teste de Deploy</h1>
    <p>Estamos preparando este site. Em breve o conteúdo estará disponível.</p>
    <footer>teste.viva.rio.br</footer>
  </div>
</body>
</html>
